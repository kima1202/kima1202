name: Refresh live scene

# 只由定时器与手动触发：自动提交由 GITHUB_TOKEN 完成，不会再次触发本 workflow，
# 也不会与「抓取天气」的那条 workflow 抢同一批文件。
on:
  schedule:
    # UTC 每 3 小时 → 北京时间 08/11/14/17/20/23/02/05 点，
    # 覆盖白昼、黄昏、夜晚、黎明四个时段，单张图会跟着时间换景。
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '单张（随天气/季节/时段变化）或四张分时段图'
        type: choice
        required: false
        default: 'single'
        options: ['single', 'quad']
      season:
        description: '强制季节（留空则按月份推算）：spring / summer / autumn / winter'
        required: false
        default: ''
      phase:
        description: '单张模式强制时段（留空则按北京时间自动判定）'
        type: choice
        required: false
        default: ''
        options: ['', 'dawn', 'day', 'dusk', 'night']
      offline:
        description: '跳过实时天气，只用仓库内的天气文件'
        type: boolean
        required: false
        default: false
      static:
        description: '本次只生成静态 SVG（不导出 GIF）'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-scenes
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install fonts and GIF deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-wqy-microhei libcairo2
          python -m pip install --disable-pip-version-check -q cairosvg Pillow

      - name: Generate scene
        env:
          # 位置与展示名可用仓库变量覆盖（Settings → Secrets and variables → Actions → Variables）
          SCENE_LAT: ${{ vars.SCENE_LAT || '23.09' }}
          SCENE_LON: ${{ vars.SCENE_LON || '110.18' }}
          SCENE_CITY: ${{ vars.SCENE_CITY || '玉林' }}
          SCENE_SEASON: ${{ inputs.season }}
          SCENE_PHASE: ${{ inputs.phase }}
          SCENE_OFFLINE: ${{ inputs.offline && '1' || '0' }}
          MODE: ${{ inputs.mode || 'single' }}
          STATIC: ${{ inputs.static && '1' || '0' }}
        run: |
          EXTRA=""
          if [ "$MODE" = "single" ]; then
            EXTRA="$EXTRA --single"
          elif [ "$STATIC" = "0" ]; then
            EXTRA="$EXTRA --preview"
          fi
          if [ -n "$SCENE_PHASE" ]; then EXTRA="$EXTRA --phase $SCENE_PHASE"; fi
          if [ "$STATIC" = "0" ]; then EXTRA="$EXTRA --gif"; fi
          python scripts/gen_scene.py --out-dir assets $EXTRA

      - name: Validate generated files
        env:
          MODE: ${{ inputs.mode || 'single' }}
          EXPECT_GIF: ${{ inputs.static && '0' || '1' }}
          EXPECT_STATIC: ${{ inputs.static && '1' || '0' }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import xml.etree.ElementTree as ET
          from PIL import Image

          out = pathlib.Path('assets')
          single = os.environ.get('MODE', 'single') == 'single'
          expect_gif = os.environ.get('EXPECT_GIF', '1') == '1'
          expect_static = os.environ.get('EXPECT_STATIC', '0') == '1'
          meta = json.loads((out / 'scenes.json').read_text(encoding='utf-8'))

          assert meta['mode'] == ('single' if single else 'quad')
          assert meta['season'] in ('spring', 'summer', 'autumn', 'winter')
          assert meta['animated'] == (not expect_static)
          assert meta['gif'] == expect_gif

          stems = ['scene-live'] if single else [f'scene-{p}' for p in ('dawn','day','dusk','night')]
          for stem in stems:
              path = out / f'{stem}.svg'
              root = ET.parse(path).getroot()
              assert root.tag.endswith('svg'), f'{path} 不是 SVG'
              assert len(list(root)) > 5, f'{path} 内容过少'
              if expect_gif:
                  gif = out / f'{stem}.gif'
                  with Image.open(gif) as im:
                      assert getattr(im, 'n_frames', 1) > 1, f'{gif} 不是动图'
          if not single and expect_gif:
              assert (out / 'scene-preview.gif').is_file()
          assert len(meta['phases']) == len(stems)
          print(f'校验通过：{len(stems)} 张动态 SVG + scenes.json'
                + (f' + {len(stems) + (0 if single else 1)} 张 GIF' if expect_gif else ''))
          PY

      - name: Drop files from the other mode
        env:
          MODE: ${{ inputs.mode || 'single' }}
        run: |
          if [ "$MODE" = "single" ]; then
            git rm -f --ignore-unmatch \
              assets/scene-dawn.svg assets/scene-day.svg \
              assets/scene-dusk.svg assets/scene-night.svg \
              assets/scene-dawn.gif assets/scene-day.gif \
              assets/scene-dusk.gif assets/scene-night.gif \
              assets/scene-preview.gif || true
          else
            git rm -f --ignore-unmatch \
              assets/scene-live.svg assets/scene-live.gif || true
          fi

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --cached --quiet; then
            echo "场景无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: refresh live weather scene [skip ci]"
          git push
