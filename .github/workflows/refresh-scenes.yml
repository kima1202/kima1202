name: Refresh live weather scene

# 覆盖仓库里已有的 .github/workflows/refresh-scenes.yml 即可。
# 不用替换 scripts/gen_scene.py、不用改 Settings、不用碰已有的 Snake/metrics workflow。
#
# 为什么这一版能修好「11 月还显示秋」：
#   1) 季节在 workflow 里按节气算好（11/7 立冬起 = winter），
#      并且【显式作为命令行参数 --season 传给生成器】，不再只靠环境变量。
#      命令行参数优先级最高，可压过旧脚本的整月规则，也能压过
#      data/weather.json 里可能锁死的 "season": "autumn"。
#   2) 生成后立刻读 assets/scenes.json 断言 season，不对就整条 workflow 报错，
#      绝不会把「秋」图提交上去。日志里会打印本次季节，一眼可查。
#   3) 自动删除仓库里可能残留的第二个天气 workflow（refresh-weather-scene.yml），
#      避免两条流水线抢着提交同一批文件、旧的那条把冬图覆盖回秋图。
#   4) 产物变化时自动把 README 里 scene-live 图片的 ?v= 换成 run id，
#      顺手破掉 GitHub 图片代理缓存（只改这一处，不碰 Snake 那块）。
#
# 每次运行都重新计算季节，四季仍自动变化；只有手动填 season 才会临时固定。
on:
  schedule:
    # UTC 每 3 小时 → 北京时间 08/11/14/17/20/23/02/05，覆盖四个时段
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '单张（随天气/季节/时段变化）或四张分时段图'
        type: choice
        required: false
        default: 'single'
        options: ['single', 'quad']
      season:
        description: '强制季节，留空按节气自动判定（推荐留空）'
        type: choice
        required: false
        default: ''
        options: ['', 'spring', 'summer', 'autumn', 'winter']
      phase:
        description: '单张模式强制时段，留空按北京时间自动判定'
        type: choice
        required: false
        default: ''
        options: ['', 'dawn', 'day', 'dusk', 'night']
      offline:
        description: '跳过实时天气，只用仓库内的天气文件'
        type: boolean
        required: false
        default: false
      static:
        description: '本次只生成静态 SVG（不导出 GIF）'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-scenes
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve season (solar terms)
        env:
          FORCED_SEASON: ${{ inputs.season }}
          SEASON_RULE: ${{ vars.SCENE_SEASON_RULE || 'solar' }}
          HEMISPHERE: ${{ vars.SCENE_HEMISPHERE || 'north' }}
        run: |
          if [ -n "$FORCED_SEASON" ]; then
            SEASON="$FORCED_SEASON"
            echo "使用手动指定的季节: $SEASON"
          else
            SEASON="$(python - <<'PY'
          import datetime as dt
          import os

          # 用北京时间判定；默认按节气，SCENE_SEASON_RULE=month 可切回整月
          now = dt.datetime.now(dt.timezone.utc) + dt.timedelta(hours=8)
          md = (now.month, now.day)
          rule = os.environ.get('SEASON_RULE', 'solar')
          if rule == 'month':
              idx = {12: 3, 1: 3, 2: 3, 3: 0, 4: 0, 5: 0,
                     6: 1, 7: 1, 8: 1, 9: 2, 10: 2, 11: 2}[now.month]
          else:
              # 2/4 立春、5/5 立夏、8/7 立秋、11/7 立冬
              if md >= (11, 7) or md < (2, 4):
                  idx = 3
              elif md < (5, 5):
                  idx = 0
              elif md < (8, 7):
                  idx = 1
              else:
                  idx = 2
          if os.environ.get('HEMISPHERE', 'north') == 'south':
              idx = (idx + 2) % 4
          print(('spring', 'summer', 'autumn', 'winter')[idx])
          PY
          )"
            echo "按节气自动判定季节: $SEASON（北京时间 $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')）"
          fi
          echo "SCENE_SEASON=$SEASON" >> "$GITHUB_ENV"
          echo "::notice::本次季节 = $SEASON"

      - name: Install fonts and GIF deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-wqy-microhei libcairo2
          python -m pip install --disable-pip-version-check -q cairosvg Pillow

      - name: Generate scene
        env:
          SCENE_LAT: ${{ vars.SCENE_LAT || '23.09' }}
          SCENE_LON: ${{ vars.SCENE_LON || '110.18' }}
          SCENE_CITY: ${{ vars.SCENE_CITY || '玉林' }}
          SCENE_PHASE: ${{ inputs.phase }}
          SCENE_OFFLINE: ${{ inputs.offline && '1' || '0' }}
          MODE: ${{ inputs.mode || 'single' }}
          STATIC: ${{ inputs.static && '1' || '0' }}
        run: |
          set -e
          test -f scripts/gen_scene.py || { echo "::error::缺少 scripts/gen_scene.py"; exit 1; }
          HELP="$(python scripts/gen_scene.py --help 2>&1 || true)"
          has() { printf '%s' "$HELP" | grep -q -F -- "$1"; }

          ARGS=(--out-dir assets)
          EFFECTIVE_MODE="quad"
          GIF_SUPPORTED="0"

          # ★ 关键：季节作为命令行参数显式传入，压过脚本旧规则和天气文件里的 season
          if has '--season'; then
            ARGS+=(--season "$SCENE_SEASON")
          else
            echo "::error::scripts/gen_scene.py 不支持 --season，无法纠正季节；请替换成新版脚本"
            exit 1
          fi

          if [ "$MODE" = "single" ] && has '--single'; then
            ARGS+=(--single)
            EFFECTIVE_MODE="single"
          elif [ "$MODE" = "single" ]; then
            echo "[warn] 当前脚本不支持 --single，退化为四张分时段图"
          fi

          if [ -n "${{ inputs.phase }}" ] && has '--phase'; then
            ARGS+=(--phase "${{ inputs.phase }}")
          fi

          if [ "$STATIC" = "1" ]; then
            has '--static' && ARGS+=(--static)
          else
            if has '--gif'; then
              ARGS+=(--gif)
              GIF_SUPPORTED="1"
              if [ "$EFFECTIVE_MODE" = "quad" ]; then
                has '--preview' && ARGS+=(--preview)
              fi
            else
              echo "[warn] 当前脚本不支持 --gif，本次只输出 SVG"
            fi
          fi

          if [ "${{ inputs.offline }}" = "true" ] && has '--offline'; then
            ARGS+=(--offline)
          fi
          if has '--frames'; then ARGS+=(--frames 20); fi
          if has '--frame-ms'; then ARGS+=(--frame-ms 90); fi

          echo "本次季节(显式传参): $SCENE_SEASON · 模式: $EFFECTIVE_MODE · GIF: $GIF_SUPPORTED"
          echo "执行: python scripts/gen_scene.py ${ARGS[*]}"
          python scripts/gen_scene.py "${ARGS[@]}"

          # ★ 立刻断言：季节不对就失败，绝不让错误画面进入提交
          python - <<'PY'
          import json
          import os
          import pathlib

          want = os.environ.get('SCENE_SEASON', '')
          p = pathlib.Path('assets/scenes.json')
          if not p.is_file():
              print('[warn] 没有 scenes.json，跳过季节断言（旧脚本可能不产出该文件）')
              raise SystemExit(0)
          got = json.loads(p.read_text(encoding='utf-8')).get('season')
          print(f'季节断言: 期望 {want} / 实际 {got}')
          if want and got != want:
              raise SystemExit(
                  f'::error::季节未纠正（期望 {want}，实际 {got}）。'
                  '常见原因：data/weather.json 里锁了 season、或脚本过旧。')
          PY

          echo "EFFECTIVE_MODE=$EFFECTIVE_MODE" >> "$GITHUB_ENV"
          echo "GIF_SUPPORTED=$GIF_SUPPORTED" >> "$GITHUB_ENV"

      - name: Validate generated files
        env:
          EXPECT_GIF: ${{ inputs.static && '0' || '1' }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import xml.etree.ElementTree as ET

          out = pathlib.Path('assets')
          expect_gif = (os.environ.get('EXPECT_GIF', '1') == '1'
                        and os.environ.get('GIF_SUPPORTED', '1') == '1')
          expect_season = os.environ.get('SCENE_SEASON', '')

          svgs = sorted(out.glob('scene-*.svg'))
          assert svgs, 'assets/ 下没有任何 scene-*.svg'
          for p in svgs:
              root = ET.parse(p).getroot()
              assert root.tag.endswith('svg'), f'{p} 不是 SVG'
              assert len(list(root)) > 5, f'{p} 内容过少'

          meta_path = out / 'scenes.json'
          if meta_path.is_file():
              meta = json.loads(meta_path.read_text(encoding='utf-8'))
              assert meta.get('season') in ('spring', 'summer', 'autumn', 'winter')
              if expect_season:
                  assert meta['season'] == expect_season, (
                      f'季节不一致：期望 {expect_season}，实际 {meta["season"]}')

          if expect_gif:
              try:
                  from PIL import Image
              except ImportError:
                  print('[warn] Pillow 不可用，跳过 GIF 帧数校验')
              else:
                  gifs = sorted(out.glob('scene-*.gif'))
                  assert gifs, '声明了 GIF 导出，但 assets/ 下没有 .gif'
                  for g in gifs:
                      with Image.open(g) as im:
                          assert getattr(im, 'n_frames', 1) > 1, f'{g} 不是动图'

          print(f'校验通过：{len(svgs)} 张 SVG'
                + (f' + {len(sorted(out.glob("scene-*.gif")))} 张 GIF' if expect_gif else '')
                + f' · 季节={expect_season or "未注入"}')
          PY

      - name: Drop files from the other mode and conflicting workflows
        run: |
          if [ "$EFFECTIVE_MODE" = "single" ]; then
            git rm -f --ignore-unmatch \
              assets/scene-dawn.svg assets/scene-day.svg \
              assets/scene-dusk.svg assets/scene-night.svg \
              assets/scene-dawn.gif assets/scene-day.gif \
              assets/scene-dusk.gif assets/scene-night.gif \
              assets/scene-preview.gif || true
          else
            git rm -f --ignore-unmatch \
              assets/scene-live.svg assets/scene-live.gif || true
          fi
          # 若之前误传过第二个天气 workflow，删掉它，避免两条流水线抢着提交
          if git ls-files --error-unmatch .github/workflows/refresh-weather-scene.yml >/dev/null 2>&1; then
            echo "发现冲突的 refresh-weather-scene.yml，本次一并删除"
            git rm -f .github/workflows/refresh-weather-scene.yml || true
          fi

      - name: Commit generated files
        env:
          CACHE_TAG: ${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git add -u .github/workflows/ || true

          # 产物或文件清理有变化时，顺手把 README 里 scene-live 图片的 ?v= 换成本次 run id，
          # 让 GitHub 图片代理把它当成新 URL，立刻显示新版画面。
          # README 未引用 scene-live 时一个字都不会改，也不会触碰 Snake 那块。
          python - <<'PY'
          import os
          import pathlib
          import re

          p = pathlib.Path('README.md')
          if not p.is_file():
              print('README.md 不存在，跳过缓存刷新')
              raise SystemExit(0)
          s = p.read_text(encoding='utf-8')
          if 'assets/scene-live.' not in s and './assets/scene-live.' not in s:
              print('README 未引用 assets/scene-live.*，跳过（不改动任何内容）')
              raise SystemExit(0)
          tag = os.environ.get('CACHE_TAG', '1')
          pattern = r'(assets/scene-live\.(?:svg|gif))(?:\?v=[^"\'\s<>)]*)?'
          new, n = re.subn(pattern, lambda m: f"{m.group(1)}?v={tag}", s)
          if n == 0 or new == s:
              print('图片版本号已是最新，无需更新')
              raise SystemExit(0)
          p.write_text(new, encoding='utf-8')
          print(f'已更新 {n} 处图片版本号为 ?v={tag}')
          PY
          git add README.md

          if git diff --cached --quiet; then
            echo "场景无变化，跳过提交（内容确定性设计，不撑大 git 历史）"
            exit 0
          fi

          git commit -m "chore: refresh live weather scene [skip ci]"
          git push || {
            echo "首次 push 失败，rebase 后重试"
            CUR="$(git rev-parse --abbrev-ref HEAD)"
            git pull --rebase origin "$CUR" && git push
          }
