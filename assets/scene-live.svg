<g class="halo" style="animation-duration:6.00s;animation-delay:-0.90s"><circle cx="955" cy="230" r="72" fill="#ffcf8f" opacity="0.12"/><circle cx="955" cy="230" r="98" fill="#ffcf8f" opacity="0.09"/><circle cx="955" cy="230" r="124" fill="#ffcf8f" opacity="0.05"/></g><circle cx="955" cy="230" r="46" fill="#ffcf8f"/>
