<text x="36" y="48" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="27" font-weight="700" fill="#38281f" letter-spacing="1">秋 · 阴 · 白昼</text><text x="37" y="74" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#38281f" opacity="0.85" letter-spacing="1.5">AUTUMN / OVERCAST · 玉林 · 19.6°C</text><text x="1164" y="374" text-anchor="end" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#38281f" opacity="0.65" letter-spacing="2">DAY · 2026-11-11 CST</text>
</svg>
