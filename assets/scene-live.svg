<g class="cloud" style="animation-duration:20.00s;animation-delay:-3.28s"><g fill="#c8d2dd" opacity="0.95"><ellipse cx="35.2" cy="110.4" rx="63.0" ry="28.6"/><ellipse cx="78.1" cy="84.6" rx="54.4" ry="40.1"/><ellipse cx="129.7" cy="96.1" rx="60.1" ry="34.3"/><ellipse cx="169.7" cy="113.3" rx="51.5" ry="25.8"/><rect x="35.2" y="104.7" width="134.5" height="28.6" rx="14.3"/></g></g><g class="cloud" style="animation-duration:20.00s;animation-delay:-9.59s"><g fill="#c8d2dd" opacity="0.95"><ellipse cx="281.3" cy="87.6" rx="61.6" ry="28.0"/><ellipse cx="323.2" cy="62.4" rx="53.2" ry="39.2"/><ellipse cx="373.6" cy="73.6" rx="58.8" ry="33.6"/><ellipse cx="412.8" cy="90.4" rx="50.4" ry="25.2"/><rect x="281.3" y="82.0" width="131.5" height="28.0" rx="14.0"/></g></g><g class="cloud" style="animation-duration:20.00s;animation-delay:-10.82s"><g fill="#c8d2dd" opacity="0.95"><ellipse cx="416.7" cy="156.2" rx="52.3" ry="23.8"/><ellipse cx="452.4" cy="134.8" rx="45.2" ry="33.3"/><ellipse cx="495.1" cy="144.4" rx="49.9" ry="28.5"/><ellipse cx="528.4" cy="158.6" rx="42.8" ry="21.4"/><rect x="416.7" y="151.5" width="111.7" height="23.8" rx="11.9"/></g></g><g class="cloud" style="animation-duration:20.00s;animation-delay:-10.86s"><g fill="#c8d2dd" opacity="0.95"><ellipse cx="648.3" cy="164.8" rx="43.8" ry="19.9"/><ellipse cx="678.1" cy="146.9" rx="37.8" ry="27.8"/><ellipse cx="713.9" cy="154.9" rx="41.8" ry="23.9"/><ellipse cx="741.7" cy="166.8" rx="35.8" ry="17.9"/><rect x="648.3" y="160.8" width="93.5" height="19.9" rx="9.9"/></g></g><g class="cloud" style="animation-duration:20.00s;animation-delay:-17.59s"><g fill="#c8d2dd" opacity="0.95"><ellipse cx="807.1" cy="99.8" rx="53.7" ry="24.4"/><ellipse cx="843.7" cy="77.8" rx="46.4" ry="34.2"/><ellipse cx="887.6" cy="87.6" rx="51.3" ry="29.3"/><ellipse cx="921.8" cy="102.2" rx="43.9" ry="22.0"/><rect x="807.1" y="94.9" width="114.7" height="24.4" rx="12.2"/></g></g>
